  description: >-
    The Coolify platform - an open-source, Apache-2.0 licensed, self-hostable PaaS written in PHP (Laravel)
    that automates deployment of applications, databases, and services to user-controlled servers via
    Docker and Docker Compose. Includes free SSL, scheduled backups to S3, pull-request previews, real-time
    logs, and a team-based RBAC model.
